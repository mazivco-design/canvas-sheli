<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מחברת עיפרון">
<meta name="theme-color" content="#fbfaf6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}</style>
<title>מחברת עיפרון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen paper with stacked layer canvases; brush panel on the left, layers panel on the right, tool dock at bottom */
:root{
  --paper:#fbfaf6; --ink:#1f2328; --dock:#ffffff; --line:#e3e1d9; --accent:#2f6fde; --muted:#6b6f76; --check:#efede6;
  --pad1:#ffffff; --pad2:#ecebe6; /* the tip pad is always light paper, in both themes */
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1c1d20;--ink:#e9e7e1;--dock:#2a2b2f;--line:#3a3b40;--accent:#6d9cf0;--muted:#9a9ca3;--check:#33343a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1c1d20;--ink:#e9e7e1;--dock:#2a2b2f;--line:#3a3b40;--accent:#6d9cf0;--muted:#9a9ca3;--check:#33343a;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#wrap{position:relative;height:100%}
#stack{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#stack canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.top{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.top .side{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--dock);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgb(0 0 0 / .06);min-height:32px}
.pill b{color:var(--ink);font-weight:500}
.pill label{display:flex;align-items:center;gap:6px;cursor:pointer}
button.pill{height:auto;font-size:14px;color:var(--ink);border-radius:999px}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--dock);border:1px solid var(--line);border-radius:22px;padding:8px 10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);
  box-shadow:0 8px 30px rgb(0 0 0 / .12);z-index:5}
.grp{display:flex;align-items:center;gap:6px}
.sep{width:1px;height:28px;background:var(--line)}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:12px;
  min-width:44px;height:44px;padding:0 10px;cursor:pointer;display:grid;place-items:center;font-size:14px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent)}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#brushBtn{display:flex;gap:6px;align-items:center;padding:0 12px}
#brushBtn span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:30px;height:30px;min-width:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--dock),0 0 0 4px var(--ink)}
input[type=color]{width:34px;height:34px;border:none;background:none;padding:0;cursor:pointer}
input[type=range]{width:110px;accent-color:var(--accent)}
.size-dot{width:28px;height:28px;display:grid;place-items:center}
.size-dot i{display:block;border-radius:50%;background:var(--ink)}

/* shared panel shell */
.panel{position:absolute;top:54px;max-width:calc(100% - 32px);max-height:calc(100% - 190px);background:var(--dock);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgb(0 0 0 / .14);display:flex;flex-direction:column;overflow:hidden;z-index:4}
.panel>header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 12px;font-weight:500;flex:none}
.panel>header .grp button{min-width:38px;height:38px}

/* layers panel */
#layers{right:max(16px,env(safe-area-inset-right,0px));width:260px}
#lyList{overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:4px}
.ly{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;border:1px solid transparent;cursor:pointer}
.ly.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ly canvas{width:54px;height:40px;border-radius:6px;border:1px solid var(--line);flex:none;
  background:repeating-conic-gradient(var(--check) 0 25%,var(--paper) 0 50%) 0 0/10px 10px}
.ly input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 6px;-webkit-user-select:text;user-select:text}
.ly input:focus{border-color:var(--line);outline:none;background:var(--paper)}
.ly .eye{min-width:36px;height:36px;padding:0;color:var(--muted)}
.ly.hid .eye{color:var(--line)}
.ly.hid canvas{opacity:.35}
#layers footer{border-top:1px solid var(--line);padding:8px 12px;display:grid;gap:6px;font-size:13px;color:var(--muted)}
#layers footer .row{display:flex;align-items:center;gap:8px}
#layers footer input[type=range]{flex:1;width:auto}
#layers footer .row button{min-width:0;height:36px;flex:1;border:1px solid var(--line);font-size:13px}

/* brush panel */
#brushes{left:max(16px,env(safe-area-inset-left,0px));width:310px}
#brushes .scroll{overflow-y:auto;padding:0 12px 12px;display:grid;gap:12px}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bt{position:relative;display:grid;gap:2px;padding:6px;border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:start;background:transparent}
.bt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bt canvas{width:100%;height:36px;display:block}
.bt span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt .x{position:absolute;top:2px;left:2px;min-width:26px;height:26px;padding:0 6px;font-size:12px;border-radius:8px;color:var(--muted)}
.bt .x.armed{color:#fff;background:#e5484d}
.sec{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;margin-top:4px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.pvrow{display:flex;gap:8px}
#prev,#tipView{height:96px;border-radius:12px;border:1px solid var(--line);
  background:repeating-conic-gradient(var(--check) 0 25%,var(--paper) 0 50%) 0 0/12px 12px}
#prev{flex:1;min-width:0;width:100%}
#tipView{width:96px;flex:none}
.ctl{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:center;gap:8px;font-size:13px}
.ctl input[type=range]{width:100%}
.ctl output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:start;font-size:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{height:32px;min-width:0;padding:0 10px;border:1px solid var(--line);font-size:13px;border-radius:9px}
.segrow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
#brushes footer{border-top:1px solid var(--line);padding:8px 12px;display:grid;gap:6px;flex:none}
#brushes footer .row{display:flex;gap:6px}
#brushes footer input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px;-webkit-user-select:text;user-select:text}
#brushes footer button{height:38px;border:1px solid var(--line);font-size:13px}
.heads{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.heads button{height:34px;min-width:0;padding:0 12px;border:1px solid var(--line);font-size:13px;border-radius:9px}
.heads button.add{color:var(--accent);border-style:dashed}
.heads button.del{color:var(--muted);margin-inline-start:auto}
.hint2{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
#brushName2 em{font-style:normal;color:var(--accent);font-size:12px}

/* brush-tip editor */
#tipEditor{position:absolute;inset:0;background:rgb(0 0 0 / .5);display:grid;place-items:center;z-index:10;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.te{background:var(--dock);border-radius:20px;padding:16px;display:grid;gap:12px;width:min(660px,100%);max-height:100%;overflow:auto}
.te h2{margin:0;font-size:18px;font-weight:500}
.te p.sub{margin:0;font-size:13px;color:var(--muted)}
.te-body{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.padwrap{position:relative}
#tePad{width:100%;aspect-ratio:1;max-width:100%;display:block;border-radius:14px;border:1px solid var(--line);touch-action:none;
  background:repeating-conic-gradient(var(--pad2) 0 25%,var(--pad1) 0 50%) 0 0/16px 16px}
.hint{position:absolute;inset:0;display:grid;place-items:center;color:#6b6f76;pointer-events:none;font-size:14px;text-align:center;padding:24px}
.te-side{display:grid;gap:10px;font-size:13px}
.te-side .seg button{height:34px}
.te-row{display:flex;gap:6px;flex-wrap:wrap}
.te-row button{height:38px;border:1px solid var(--line);font-size:13px;min-width:0}
.te-res{display:flex;gap:10px;align-items:center}
#teMask{width:84px;height:84px;flex:none;border:1px solid var(--line);border-radius:10px;
  background:repeating-conic-gradient(var(--check) 0 25%,var(--paper) 0 50%) 0 0/12px 12px}
#tePrev{width:100%;height:84px;min-width:0;border:1px solid var(--line);border-radius:10px;
  background:repeating-conic-gradient(var(--check) 0 25%,var(--paper) 0 50%) 0 0/12px 12px}
.te input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px;-webkit-user-select:text;user-select:text;min-width:0;flex:1}
.te footer{display:flex;gap:8px;flex-wrap:wrap}
.te footer button{height:42px;border:1px solid var(--line)}
@media (max-width:600px){.te-body{grid-template-columns:1fr}}

/* dragging + snapping */
.panel>header{cursor:grab;touch-action:none;position:relative;padding-top:14px}
.panel>header::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.grip{min-width:28px;width:28px;padding:0;cursor:grab;touch-action:none;color:var(--muted)}
.grip svg{fill:currentColor;stroke:none}
.dragging{cursor:grabbing!important;box-shadow:0 14px 40px rgb(0 0 0 / .22)!important;transition:none!important}
.dragging>header{cursor:grabbing}
.snapping{outline:2px solid var(--accent);outline-offset:2px}
.placed{transition:left .18s ease,top .18s ease,right .18s ease,bottom .18s ease}
@media (prefers-reduced-motion:reduce){.placed{transition:none}}

#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none;z-index:9}
#saveBox{position:absolute;inset:0;background:rgb(0 0 0 / .55);display:grid;place-items:center;z-index:10;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#saveBox .card{background:var(--dock);border-radius:18px;padding:16px;max-width:min(720px,100%);display:grid;gap:12px;text-align:center}
#saveBox img{border-radius:10px;border:1px solid var(--line);max-height:60vh;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#saveBox p{margin:0;font-size:15px}
@media (max-width:560px){input[type=range]{width:80px}.sep{display:none}#status{display:none}}
</style>
</head>
<body>


<div id="wrap" dir="rtl">
  <div id="stack" aria-label="משטח ציור"></div>

  <div class="top">
    <div class="side">
      <button class="pill on" id="lyToggle" aria-expanded="true">שכבות · <b id="lyName">שכבה 2</b></button>
      <div class="pill" id="status">עט: <b id="penState">לא זוהה עדיין</b> · לחץ <b id="pr">–</b></div>
    </div>
    <div class="pill"><label><input type="checkbox" id="penOnly" checked> רק עט</label></div>
  </div>

  <aside id="layers" class="panel" aria-label="שכבות">
    <header>
      <span>שכבות</span>
      <div class="grp">
        <button id="lyAdd" title="שכבה חדשה" aria-label="שכבה חדשה"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="lyDup" title="שכפל שכבה" aria-label="שכפל שכבה"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg></button>
        <button id="lyDel" title="מחק שכבה" aria-label="מחק שכבה"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
    </header>
    <div id="lyList"></div>
    <footer>
      <div class="row"><span>שקיפות</span><input type="range" id="lyOp" min="0" max="100" value="100" aria-label="שקיפות שכבה"><b id="lyOpV">100%</b></div>
      <div class="row">
        <button id="lyUp">הזז למעלה</button>
        <button id="lyDown">הזז למטה</button>
        <button id="lyMerge">מזג למטה</button>
      </div>
    </footer>
  </aside>

  <aside id="brushes" class="panel" aria-label="מברשות">
    <header>
      <span id="brushName2">מברשת</span>
      <div class="grp"><button id="brClose" aria-label="סגור"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    </header>
    <div class="scroll">
      <div class="lib" id="lib"></div>
      <div class="pvrow">
        <canvas id="tipView" aria-label="ראש המברשת – נגיעה אחת"></canvas>
        <canvas id="prev" aria-label="תצוגה מקדימה של המברשת"></canvas>
      </div>
      <div id="ctls" style="display:grid;gap:8px"></div>
    </div>
    <footer>
      <div class="row"><button id="teOpen" style="flex:1">✎ ראש מברשת מציור</button></div>
      <div class="row">
        <button id="brReset" hidden>אפס שינויים</button>
        <button id="brUpdate" hidden>עדכן מברשת</button>
      </div>
      <div class="row">
        <input id="brNewName" placeholder="שם למברשת חדשה" maxlength="24" aria-label="שם למברשת חדשה">
        <button id="brSave">שמור כמברשת</button>
      </div>
    </footer>
  </aside>

  <div class="dock" role="toolbar" aria-label="כלי ציור">
    <button class="grip" id="dockGrip" aria-label="גרור את סרגל הכלים" title="גרור"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
    <div class="grp">
      <button id="brushBtn" class="on" aria-expanded="true" title="מברשות"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6z"/><path d="M4 20c1-3 2-4 4-4"/></svg><span id="brushName">דיו</span></button>
      <button id="tEraser" title="מחק" aria-label="מחק"><svg viewBox="0 0 24 24"><path d="M3 17l8-8 7 7-4 4H7z"/><path d="M14 20h7"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="swatches"></div>
    <input type="color" id="custom" value="#8a3ffc" aria-label="צבע מותאם">
    <div class="sep"></div>
    <div class="grp">
      <div class="size-dot"><i id="dot"></i></div>
      <input type="range" id="size" min="1" max="120" value="9" aria-label="עובי">
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="undo" title="בטל" aria-label="בטל"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button id="redo" title="חזור" aria-label="חזור"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button id="clear">נקה שכבה</button>
      <button id="save">שמור</button>
    </div>
  </div>

  <div id="tipEditor" hidden>
    <div class="te" role="dialog" aria-label="ראש מברשת חדש">
      <div>
        <h2>ראש מברשת חדש</h2>
        <p class="sub">כל מה שמצויר כאן הופך לחותמת שהמברשת מטביעה לאורך הקו. אזורים כהים או מלאים = צבע, ריק או לבן = שקוף.</p>
      </div>
      <div class="te-body">
        <div class="padwrap">
          <canvas id="tePad" width="512" height="512" aria-label="משטח לציור ראש המברשת"></canvas>
          <div class="hint" id="teHint">צייר כאן צורה, כוכב, עלה, שריטות…<br>או טען מהשכבה / מתמונה</div>
        </div>
        <div class="te-side">
          <div class="segrow"><span>כלי</span><div class="seg" id="teTool">
            <button data-v="pen" class="on">עט</button><button data-v="erase">מחק</button></div></div>
          <div class="segrow"><span>עובי</span><div class="seg" id="teSize">
            <button data-v="5">דק</button><button data-v="14" class="on">בינוני</button><button data-v="36">עבה</button></div></div>
          <div class="te-row">
            <button id="teLayer">מהשכבה הנוכחית</button>
            <button id="teFileBtn">מתמונה…</button>
            <input type="file" id="teFile" accept="image/*" hidden>
            <button id="teInvert">הפוך</button>
            <button id="teClear">נקה</button>
          </div>
          <span class="sec">התוצאה</span>
          <div class="te-res">
            <canvas id="teMask" aria-label="ראש המברשת"></canvas>
            <canvas id="tePrev" aria-label="קו לדוגמה"></canvas>
          </div>
        </div>
      </div>
      <footer>
        <input type="text" id="teName" placeholder="שם למברשת" maxlength="24" aria-label="שם למברשת">
        <button id="teCreate" class="on">צור מברשת</button>
        <button id="teCancel">ביטול</button>
      </footer>
    </div>
  </div>

  <div id="toast" hidden></div>

  <div id="saveBox" hidden>
    <div class="card">
      <img id="saveImg" alt="הציור שלך">
      <p>לחיצה ארוכה על התמונה ← "שמור בתמונות"</p>
      <button id="closeSave" class="on">סגור</button>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const stack=$('stack');
const COLORS=['#1f2328','#e5484d','#f5a524','#30a46c','#2f6fde','#ffffff'];
let color=COLORS[0], erasing=false, dpr=1;

// =================== BRUSH ENGINE ===================
const DEF={size:6,opacity:100,flow:100,softness:0,spacing:5,shape:'round',roundness:100,angle:0,angleSrc:'fixed',
  grain:0,overlap:100,scatter:0,sizeJitter:0,angleJitter:0,pSize:70,pOpacity:0,minSize:10,smoothing:20};

let layers=[],active=null,nextNum=1,history=[],future=[],cur=null,activeId=null,st=null,lastRaw=null;

function makeLayer(name,strokes=[]){const c=document.createElement('canvas');
  return{name:name||('שכבה '+nextNum++),canvas:c,ctx:c.getContext('2d',{willReadFrequently:true}),strokes,visible:true,opacity:1,thumb:null};}
function fit(c){const r=stack.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);}
function mount(){
  layers.forEach((L,i)=>{L.canvas.style.zIndex=i*2;L.canvas.style.opacity=L.opacity;L.canvas.hidden=!L.visible;
    if(L.canvas.parentNode!==stack)stack.appendChild(L.canvas);});
  [...stack.children].forEach(c=>{if(!layers.some(L=>L.canvas===c))c.remove();});
}
function insertLayer(L,i){fit(L.canvas);layers.splice(i,0,L);mount();redrawLayer(L);}
function removeLayer(L){layers.splice(layers.indexOf(L),1);mount();}
const idx=L=>layers.indexOf(L);

  c.clearRect(0,0,L.canvas.width,L.canvas.height);

}

window.addEventListener('resize',resize);

// history
function push(a){history.push(a);future=[];updUndo();}
function apply(a,dir){
  const L=a.layer;
  switch(a.type){
    case'stroke':dir>0?L.strokes.push(a.stroke):L.strokes.pop();redrawLayer(L);break;
    case'clear':L.strokes=dir>0?[]:a.strokes.slice();redrawLayer(L);break;
    case'add':if(dir>0){insertLayer(L,a.index);active=L;}else{removeLayer(L);if(active===L)active=layers[Math.max(0,a.index-1)];}break;
    case'delete':if(dir>0){removeLayer(L);if(active===L)active=layers[Math.max(0,a.index-1)];}else{insertLayer(L,a.index);active=L;}break;
    case'move':{const f=dir>0?a.from:a.to,t=dir>0?a.to:a.from;layers.splice(f,1);layers.splice(t,0,L);mount();break;}
    case'merge':{const B=a.below;
      if(dir>0){B.strokes=a.mergedStrokes;removeLayer(L);active=B;}else{B.strokes=a.belowStrokes;insertLayer(L,a.index);active=L;}
      redrawLayer(B);break;}

}
$('undo').onclick=()=>{const a=history.pop();if(a){apply(a,-1);future.push(a);updUndo();}};
$('redo').onclick=()=>{const a=future.pop();if(a){apply(a,1);history.push(a);updUndo();}};
function updUndo(){$('undo').disabled=!history.length;$('redo').disabled=!future.length;}

const penOnly=$('penOnly');let penSeen=false;
function allowed(e){
  if(e.pointerType==='pen'){if(!penSeen){penSeen=true;$('penState').textContent='מחובר ✓';}return true;}
  if(e.pointerType==='touch')return!(penOnly.checked&&penSeen);
  return true;
}
function raw(e){
  const r=stack.getBoundingClientRect();
  let p=e.pointerType==='pen'?e.pressure:0.6, az=null;
  if(typeof e.azimuthAngle==='number'&&e.pointerType==='pen')az=e.azimuthAngle;
  else if(e.tiltX||e.tiltY)az=Math.atan2(e.tiltY,e.tiltX);
  return{x:e.clientX-r.left,y:e.clientY-r.top,p,az};

function smooth(q){ // streamline: lag the point toward the pen
  const pts=cur.pts,last=pts[pts.length-1],k=cur.b.smoothing/100*.9;

  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0){toast('השכבה הנוכחית ריקה');return;}
  x0=Math.max(0,x0-2);y0=Math.max(0,y0-2);x1=Math.min(w-1,x1+2);y1=Math.min(h-1,y1+2);
  fitIntoPad(c,x0,y0,x1-x0+1,y1-y0+1);
};

// =================== MOVABLE PANELS ===================
// Drag a panel by its header (the toolbar by its grip). Drop it near a screen edge and it sticks to that edge.
const wrapEl=$('wrap'),EDGE=12,TOP=54,SNAP=56;
let placements={};try{placements=JSON.parse(localStorage.getItem('pencil-panels')||'{}');}catch(e){placements={};}
function savePlacements(){try{localStorage.setItem('pencil-panels',JSON.stringify(placements));}catch(e){}}
function placeEl(el,pl){
  const W=wrapEl.clientWidth,H=wrapEl.clientHeight,w=el.offsetWidth,h=el.offsetHeight,st=el.style;
  st.transform='none';st.left=st.right=st.top=st.bottom='auto';
  if(pl.x==='left')st.left=EDGE+'px';else if(pl.x==='right')st.right=EDGE+'px';
  else st.left=Math.min(Math.max(EDGE,pl.x),Math.max(EDGE,W-w-EDGE))+'px';
  let top;
  if(pl.y==='top')top=TOP;else if(pl.y==='bottom')top=null;else top=Math.min(Math.max(EDGE,pl.y),Math.max(EDGE,H-h-EDGE));
  if(top==null){st.bottom='calc('+EDGE+'px + env(safe-area-inset-bottom,0px))';if(el.classList.contains('panel'))st.maxHeight=(H-TOP-EDGE)+'px';}
  else{st.top=top+'px';if(el.classList.contains('panel'))st.maxHeight=(H-top-EDGE)+'px';}
}
function makeMovable(el,handle){
  let start=null,moved=false;
  handle.addEventListener('pointerdown',e=>{
    if(e.target!==handle&&e.target.closest('button,input,label')&&e.target.closest('button,input,label')!==handle)return;
    const r=el.getBoundingClientRect(),wr=wrapEl.getBoundingClientRect();
    start={px:e.clientX,py:e.clientY,x:r.left-wr.left,y:r.top-wr.top,id:e.pointerId};moved=false;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove',e=>{
    if(!start||e.pointerId!==start.id)return;
    const dx=e.clientX-start.px,dy=e.clientY-start.py;
    if(!moved){if(Math.hypot(dx,dy)<5)return;moved=true;el.classList.remove('placed');el.classList.add('dragging');}
    e.preventDefault();
    const W=wrapEl.clientWidth,H=wrapEl.clientHeight,w=el.offsetWidth,h=el.offsetHeight;
    const x=Math.min(Math.max(0,start.x+dx),W-w),y=Math.min(Math.max(0,start.y+dy),H-h);
    const st=el.style;st.transform='none';st.right=st.bottom='auto';st.left=x+'px';st.top=y+'px';
    el.classList.toggle('snapping',x<SNAP||x>W-w-SNAP||y<SNAP+TOP-EDGE||y>H-h-SNAP);
  });
  const drop=e=>{
    if(!start||e.pointerId!==start.id)return;start=null;
    if(!moved)return;
    el.classList.remove('dragging','snapping');
    const W=wrapEl.clientWidth,H=wrapEl.clientHeight,w=el.offsetWidth,h=el.offsetHeight,x=el.offsetLeft,y=el.offsetTop;
    const pl={x:x<SNAP?'left':x>W-w-SNAP?'right':Math.round(x),y:y<SNAP+TOP-EDGE?'top':y>H-h-SNAP?'bottom':Math.round(y)};
    placements[el.id]=pl;savePlacements();el.classList.add('placed');placeEl(el,pl);
    requestAnimationFrame(()=>setTimeout(()=>el.classList.remove('placed'),200));
  };
  handle.addEventListener('pointerup',drop);handle.addEventListener('pointercancel',drop);
  // a drag must not also count as a click on the grip
  handle.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
}
const dockEl=document.querySelector('.dock');dockEl.id='dock';
makeMovable($('layers'),$('layers').querySelector('header'));
makeMovable($('brushes'),$('brushes').querySelector('header'));
makeMovable(dockEl,$('dockGrip'));
function placeAll(){for(const id in placements){const el=$(id);if(el&&!el.hidden)placeEl(el,placements[id]);}}
window.addEventListener('resize',placeAll);
// panels that were hidden get placed when they open
new MutationObserver(ms=>ms.forEach(m=>{const el=m.target;if(!el.hidden&&placements[el.id])placeEl(el,placements[el.id]);}))
  .observe(wrapEl,{subtree:true,attributes:true,attributeFilter:['hidden']});

updUndo();renderLayers();syncCtls();renderLib();drawPreview();placeAll();
})();
